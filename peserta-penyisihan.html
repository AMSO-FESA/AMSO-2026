<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Peserta Babak Penyisihan AMSO 2026</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse untuk membaca data spreadsheet dengan mudah -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(20, 26, 50, 0.65);
            --card-border: rgba(0, 210, 255, 0.2);
            --neon-blue: #00d2ff;
            --neon-purple: #9d4edd;
            --gold: #22d3ee;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
            --fesa-orange: #ff7f00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-y: scroll; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container { max-width: 1150px; margin: auto; padding: 0 20px 80px; position: relative; z-index: 1; width: 100%; }
        header { padding: 30px 0 25px; text-align: center; position: relative; }
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .sub-title { font-size: clamp(0.9rem, 2vw, 1.1rem); color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 30px; }

        .controls-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .filter-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .cat-btn {
            background: rgba(15, 21, 42, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 9px 18px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .cat-btn:hover { color: #fff; border-color: var(--neon-blue); }
        .cat-btn.active {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .search-wrapper { position: relative; flex: 1; min-width: 250px; }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-input {
            width: 100%;
            background: rgba(15, 21, 42, 0.9);
            border: 1px solid var(--card-border);
            padding: 12px 15px 12px 45px;
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }

        .table-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .table-container { width: 100%; max-height: 600px; overflow-y: auto; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        th {
            background: rgba(0, 210, 255, 0.15);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        tr:hover { background: rgba(255, 255, 255, 0.03); }
        .badge-jenjang { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; font-family: 'Orbitron', sans-serif; }
        .badge-sd { background: rgba(0, 210, 255, 0.15); color: var(--neon-blue); }
        .badge-smp { background: rgba(34, 211, 238, 0.15); color: var(--gold); }
        .badge-sma { background: rgba(157, 78, 221, 0.15); color: #d8b4fe; }
        .badge-undangan { background: rgba(255, 127, 0, 0.15); color: var(--fesa-orange); }
        .no-data, .loading-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

        footer { background: rgba(5, 7, 15, 0.95); border-top: 1px solid var(--border); padding: 35px 0 20px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="container">
        <header id="header-placeholder"></header>

        <div style="text-align: center; margin-bottom: 25px;">
            <h1 class="main-title">DAFTAR PESERTA PENYISIHAN</h1>
            <div class="sub-title">AMSO 2026 - PENCARIAN DATA PESERTA</div>
        </div>

        <main>
            <div class="controls-box">
                <div class="filter-row">
                    <div class="category-tabs">
                        <button class="cat-btn active" onclick="filterCategory('ALL', this)">SEMUA (<span id="countAll">0</span>)</button>
                        <button class="cat-btn" onclick="filterCategory('SD-MI', this)">SD / MI (<span id="countSD">0</span>)</button>
                        <button class="cat-btn" onclick="filterCategory('SMP-MTs', this)">SMP / MTs (<span id="countSMP">0</span>)</button>
                        <button class="cat-btn" onclick="filterCategory('SMA', this)">SMA (<span id="countSMA">0</span>)</button>
                        <button class="cat-btn" onclick="filterCategory('UNDANGAN', this)">UNDANGAN (<span id="countUndangan">0</span>)</button>
                    </div>
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Cari nama peserta, nomor peserta, atau sekolah..." onkeyup="filterTable()">
                    </div>
                </div>
            </div>

            <div class="table-box">
                <div class="table-container">
                    <table id="pesertaTable">
                        <thead>
                            <tr>
                                <th>NO PESERTA</th>
                                <th>NAMA PESERTA</th>
                                <th>SEKOLAH</th>
                                <th>MATA PELAJARAN</th>
                                <th>JENJANG</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke database Google Sheets...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <footer id="footer-placeholder"></footer>

    <script src="global-audio.js"></script>
    <script>
        // Link CSV Export dari Google Sheets lo (ID Spreadsheet: 1uqeAp90o0-McTigihf-hh4Z9KbSshYES)
        // Mengambil sheet pertama (SD-MI) atau gabungan sheet
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1uqeAp90o0-McTigihf-hh4Z9KbSshYES/export?format=csv&gid=0";

        let pesertaData = [];
        let currentCategory = 'ALL';

        // Tarik data langsung dari Google Sheets secara otomatis
        Papa.parse(SPREADSHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                let parsed = [];
                let currentSchool = "TIDAK DIKETAHUI";
                let currentJenjang = "SD-MI"; // Sesuaikan berdasarkan sheet/gid

                rows.forEach(row => {
                    let col1 = row[1] ? row[1].trim() : "";
                    let col2 = row[2] ? row[2].trim() : "";
                    let col3 = row[3] ? row[3].trim() : "";

                    if (!col1) return;
                    if (col1.includes("DAFTAR PESERTA") || col1 === "NO" || col2 === "NOMOR PESERTA") return;

                    // Jika kolom 2 dan 3 kosong, ini adalah nama sekolah
                    if (!col2 && !col3) {
                        currentSchool = col1;
                        return;
                    }

                    // Jika kolom 2 berisi nomor peserta (mengandung format angka/tanda hubung)
                    if (col2 && (col2.includes("-") || !isNaN(col2))) {
                        parsed.push({
                            nomor: col2,
                            nama: col3,
                            sekolah: currentSchool,
                            mapel: row[4] ? row[4].trim() : "-",
                            jenjang: currentJenjang
                        });
                    }
                });

                pesertaData = parsed;
                updateUI();
            },
            error: function(err) {
                console.error("Gagal membaca Google Sheets:", err);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="no-data" style="color: #ff4757;">Gagal terhubung ke Google Sheets. Pastikan link akses spreadsheet sudah diatur ke 'Anyone with the link can view'.</td></tr>`;
            }
        });

        function updateUI() {
            document.getElementById('countAll').innerText = pesertaData.length;
            document.getElementById('countSD').innerText = pesertaData.filter(i => i.jenjang === 'SD-MI').length;
            document.getElementById('countSMP').innerText = pesertaData.filter(i => i.jenjang === 'SMP-MTs').length;
            document.getElementById('countSMA').innerText = pesertaData.filter(i => i.jenjang === 'SMA').length;
            document.getElementById('countUndangan').innerText = pesertaData.filter(i => i.jenjang === 'UNDANGAN').length;

            renderTable(pesertaData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-data">Data peserta tidak ditemukan.</td></tr>`;
                return;
            }

            const displayData = data.slice(0, 300);

            displayData.forEach(item => {
                let badgeClass = 'badge-sd';
                let labelJenjang = 'SD/MI';
                if (item.jenjang === 'SMP-MTs') { badgeClass = 'badge-smp'; labelJenjang = 'SMP/MTs'; }
                else if (item.jenjang === 'SMA') { badgeClass = 'badge-sma'; labelJenjang = 'SMA'; }
                else if (item.jenjang === 'UNDANGAN') { badgeClass = 'badge-undangan'; labelJenjang = 'Undangan'; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--gold);">${item.nomor}</td>
                    <td style="font-weight: 600;">${item.nama}</td>
                    <td>${item.sekolah}</td>
                    <td>${item.mapel}</td>
                    <td><span class="badge-jenjang ${badgeClass}">${labelJenjang}</span></td>
                `;
                tbody.appendChild(tr);
            });

            if (data.length > 300) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="5" style="text-align: center; color: var(--gold); font-style: italic; padding: 15px;">Menampilkan 300 dari ${data.length} data. Gunakan kolom pencarian di atas untuk mencari nama sekolah atau peserta lainnya.</td>`;
                tbody.appendChild(tr);
            }
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterTable();
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = pesertaData.filter(item => {
                const matchCategory = (currentCategory === 'ALL' || item.jenjang === currentCategory);
                const matchQuery = item.nama.toLowerCase().includes(query) || 
                                   item.nomor.toLowerCase().includes(query) || 
                                   item.sekolah.toLowerCase().includes(query) ||
                                   item.mapel.toLowerCase().includes(query);
                return matchCategory && matchQuery;
            });

            renderTable(filtered);
        }
    </script>
</body>
</html>
