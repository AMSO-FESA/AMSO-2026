<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Panduan - AMSO 2026</title>

    <!-- FAVICON (LOGO TAB BROWSER) -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(20, 26, 50, 0.65);
            --card-border: rgba(0, 210, 255, 0.2);
            --neon-blue: #00d2ff;
            --neon-purple: #9d4edd;
            --gold: #ffd700;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ─── TOMBOL AUDIO DIKUNCI FIX AGAR POSISINYA DIJAMIN SAMA PERSIS DI POJOK KANAN ATAS ─── */
        .audio-float-btn {
            position: fixed !important;
            top: 25px !important;
            right: 20px !important;
            z-index: 99999;
            background: rgba(20, 26, 50, 0.65);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: var(--muted);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            font-size: 0.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .audio-float-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: var(--neon-blue);
            color: #fff;
            transform: scale(1.1);
        }

        .audio-float-btn.playing {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        @media (max-width: 600px) {
            .audio-float-btn {
                top: 15px !important;
                right: 12px !important;
                width: 30px;
                height: 30px;
                font-size: 0.72rem;
            }
        }

        /* ================= ANIMASI LATAR BELAKANG KAYA SAINS & SPACE ================= */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0b0f25 0%, #03050a 100%);
        }

        /* Bintang Berkelap-kelip */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 120px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 160px, var(--gold), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 250px 90px, var(--neon-purple), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.45;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* Galaksi / Nebula Melayang */
        .galaxy-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
            animation: floatBlob 15s infinite alternate ease-in-out;
        }

        .blob-1 { width: 450px; height: 450px; background: var(--neon-blue); top: -5%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: var(--neon-purple); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: var(--gold); top: 40%; right: 20%; animation-delay: -8s; opacity: 0.1; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        /* Elemen Melayang */
        .floating-icon {
            position: absolute;
            color: var(--neon-blue);
            opacity: 0.55;
            user-select: none;
            filter: drop-shadow(0 0 12px currentColor);
        }

        .el-rocket { top: 12%; right: 7%; font-size: 2.8rem; color: var(--neon-blue); animation: flyRocket 14s infinite ease-in-out; }
        .el-astronaut1 { bottom: 15%; left: 4%; font-size: 2.5rem; color: var(--gold); animation: floatItem1 11s infinite alternate ease-in-out; }
        .el-astronaut2 { top: 35%; left: 8%; font-size: 2rem; color: var(--neon-purple); animation: floatItem2 9s infinite alternate ease-in-out; opacity: 0.4; }
        
        /* Alat Fisika & Sains */
        .el-atom { top: 18%; left: 15%; font-size: 2.2rem; color: var(--gold); animation: rotateAtom 12s infinite linear; }
        .el-flask { bottom: 25%; right: 12%; font-size: 2.3rem; color: var(--neon-blue); animation: floatItem1 8s infinite alternate ease-in-out; }
        .el-magnet { top: 60%; left: 12%; font-size: 2.2rem; color: #ff4757; animation: floatItem2 10s infinite alternate ease-in-out; }
        .el-satellite { top: 8%; left: 40%; font-size: 2.2rem; color: var(--text-muted); animation: flySatellite 16s infinite linear; }

        /* Simbol Matematika */
        .el-math1 { top: 25%; right: 25%; font-size: 2rem; font-family: 'Orbitron', sans-serif; color: var(--gold); animation: floatItem2 7s infinite alternate ease-in-out; font-weight: 800; }
        .el-math2 { top: 75%; left: 25%; font-size: 2.2rem; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); animation: floatItem1 9s infinite alternate ease-in-out; font-weight: 800; }
        .el-math3 { top: 50%; right: 8%; font-size: 1.8rem; font-family: 'Orbitron', sans-serif; color: var(--neon-purple); animation: floatItem2 8s infinite alternate ease-in-out; font-weight: 800; }

        @keyframes flyRocket {
            0% { transform: translate(0, 0) rotate(45deg); }
            50% { transform: translate(-50px, 70px) rotate(40deg); }
            100% { transform: translate(0, 0) rotate(45deg); }
        }

        @keyframes floatItem1 {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-45px) rotate(15deg); }
        }

        @keyframes floatItem2 {
            0% { transform: translateY(0) rotate(10deg); }
            100% { transform: translateY(35px) rotate(-15deg); }
        }

        @keyframes rotateAtom {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes flySatellite {
            0% { transform: translateX(-50vw) translateY(0) rotate(0deg); }
            100% { transform: translateX(100vw) translateY(-30px) rotate(360deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* ================= HEADER ================= */
        header {
            padding: 30px 0 20px;
            text-align: center;
            position: relative;
        }

        .logo-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .logo-item {
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-item:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
        }

        .logo-item img {
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        /* Ukuran Logo Presisi */
        .logo-item img[alt="Logo Yasarini"] { height: 65px !important; }
        .logo-item img[alt="Logo FESA"] { height: 100px !important; }
        .logo-item img[alt="Logo AMSO"] { height: 100px !important; }

        /* Navigation Menu */
        nav {
            background: rgba(15, 21, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 8px;
            backdrop-filter: blur(12px);
            display: inline-flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(157, 78, 221, 0.3));
            border: 1px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-flex;
            padding-bottom: 15px; 
            margin-bottom: -15px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 21, 42, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            min-width: 190px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 100;
            padding: 8px;
            text-align: left;
        }

        .dropdown-content a {
            color: var(--text-muted);
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            border-radius: 10px;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .dropdown-content a:hover {
            background: rgba(0, 210, 255, 0.15);
            color: var(--neon-blue);
            border: none;
            box-shadow: none;
            transform: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-download {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
        }

        .btn-fullscreen {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.25), rgba(0, 210, 255, 0.2));
            color: #fff;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.2);
        }

        .btn-fullscreen:hover {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        /* ================= MAIN CONTENT VIEWER (A4 PROPORTIONS) ================= */
        main {
            flex: 1;
            padding: 10px 0 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Lebar proporsional dokumen buku (A4 centered) */
        .viewer-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
            max-width: 820px; /* Lebar dokumen A4 presisi */
            margin: 0 auto;
        }

        .viewer-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--gold));
            z-index: 2;
        }

        .viewer-header {
            padding: 14px 20px;
            background: rgba(15, 21, 42, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .viewer-header .file-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: 600;
        }

        /* Tinggi 1 Halaman A4 Proporsional (1 : 1.414) */
        .viewer-frame-container {
            width: 100%;
            height: 84vh;
            min-height: 680px;
            max-height: 1080px;
            background: #0b0f25;
            position: relative;
        }

        .viewer-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 768px) {
            .viewer-box {
                max-width: 100%;
                border-radius: 16px;
            }
            .viewer-frame-container {
                height: 75vh;
                min-height: 520px;
            }
        }

        /* ================= FOOTER ================= */
        footer {
            background: #050811;
            color: white;
            padding: 35px 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            width: 100%;
            margin-top: auto;
        }

        footer strong {
            font-size: 18px;
        }

        footer p {
            margin-top: 7px;
            font-size: 11px;
            opacity: .55;
        }
    </style>
</head>
<body>

    <div class="space-bg">
        <div class="stars"></div>
        <div class="galaxy-blob blob-1"></div>
        <div class="galaxy-blob blob-2"></div>
        <div class="galaxy-blob blob-3"></div>

        <div class="floating-icon el-rocket"><i class="fa-solid fa-rocket"></i></div>
        <div class="floating-icon el-astronaut1"><i class="fa-solid fa-user-astronaut"></i></div>
        <div class="floating-icon el-astronaut2"><i class="fa-solid fa-space-shuttle"></i></div>
        <div class="floating-icon el-satellite"><i class="fa-solid fa-satellite"></i></div>

        <div class="floating-icon el-atom" title="Fisika Kuantum/Atom"><i class="fa-solid fa-atom"></i></div>
        <div class="floating-icon el-flask" title="Laboratorium Kimia/Sains"><i class="fa-solid fa-flask-vial"></i></div>
        <div class="floating-icon el-magnet" title="Medan Magnet"><i class="fa-solid fa-magnet"></i></div>

        <div class="floating-icon el-math1">&pi;</div>

        <div class="floating-icon el-math3">&radic;</div>
    </div>

    <div class="container">
        <header>
            <div class="logo-group">
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/yasarini.png" alt="Logo Yasarini" title="Yayasan Ardhya Garini">
                </div>
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/fesa.png" alt="Logo FESA" title="Festival Edukasi Sekolah Angkasa">
                </div>
                <div class="logo-item">
                    <img src="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png" alt="Logo AMSO" title="Angkasa Mathematic and Science Olympiad">
                </div>
            </div>

            <!-- NAVBAR -->
            <nav>
                <a href="https://amso.web.id/"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="https://timeline.amso.web.id/"><i class="fa-solid fa-calendar-days"></i> Timeline</a>
                <a href="https://amso-fesa.github.io/Kategori-AMSO-2026/"><i class="fa-solid fa-layer-group"></i> Kategori</a>
                <a href="https://bukupanduan.amso.web.id/" class="active"><i class="fa-solid fa-clipboard-check"></i> Buku Panduan</a>
                
                <div class="dropdown">
                    <a href="#"><i class="fa-solid fa-folder-open"></i> Data <i class="fa-solid fa-angle-down" style="font-size: 10px; margin-left: 2px;"></i></a>
                    <div class="dropdown-content">
                        <a href="https://peserta.amso.web.id/"><i class="fa-solid fa-users" style="margin-right: 6px;"></i> Data Peserta</a>
                        <a href="https://administrasi.amso.web.id/"><i class="fa-solid fa-envelope-open-text" style="margin-right: 6px;"></i> Administrasi</a>
                    </div>
                </div>

                <a href="https://amso-fesa.github.io/Pengumuman-AMSO-2026/"><i class="fa-solid fa-trophy"></i> Pengumuman</a>
            </nav>
        </header>

        <div style="text-align: center;">
            <h1 class="main-title">BUKU PANDUAN AMSO 2026</h1>
            <p class="sub-title">Petunjuk Teknis & Pelaksanaan Kegiatan</p>

            <!-- ACTION BUTTONS -->
            <div class="action-buttons">
                <!-- DOWNLOAD LANGSUNG -->
                <a href="https://drive.google.com/uc?export=download&id=1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3" class="btn-action btn-download">
                    <i class="fa-solid fa-file-arrow-down"></i> Unduh Buku Panduan (PDF)
                </a>

                <!-- BUKA TAB BARU / FULLSCREEN -->
                <a href="https://drive.google.com/file/d/1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-action btn-fullscreen">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Layar Penuh
                </a>
            </div>
        </div>

        <!-- ================= MAIN CONTENT VIEWER ================= -->
        <main>
            <div class="viewer-box">
                <div class="viewer-header">
                    <div class="file-title">
                        <i class="fa-solid fa-file-pdf" style="color: #ff4757; font-size: 1.1rem;"></i>
                        <span>Buku_Panduan_AMSO_2026.pdf</span>
                    </div>
                    <span><i class="fa-solid fa-eye" style="color: var(--neon-blue);"></i> Mode Pratinjau Dokumen</span>
                </div>

                <div class="viewer-frame-container">
                    <iframe 
                        src="https://drive.google.com/file/d/1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3/preview" 
                        allow="autoplay"
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer>
        <strong>AMSO 2026</strong>
        <p>Angkasa Mathematic & Science Olympiad</p>
    </footer>

    <!-- PANGGIL SCRIPT GLOBAL -->
    <script src="global-audio.js"></script>

</body>
