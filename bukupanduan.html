<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Panduan - AMSO 2026</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AMSO-FESA/AMSO-2026/main/amso.png">

    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #8b5cf6;        
            --blue2: #3b82f6;       
            --navy: #0f172a;        
            --gold: #22d3ee;        
            --bg-dark: #070913;          
            --text: #f8fafc;        
            --muted: #94a3b8;       
            --white: #ffffff;
            --border: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(15, 23, 42, 0.6); 
            --neon-blue: #00d2ff;
            --neon-purple: #9d4edd;
            --card-bg: rgba(20, 26, 50, 0.65);
            --card-border: rgba(0, 210, 255, 0.2);
        }

        html {
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 210, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* ─── TOMBOL AUDIO KECIL & TRANSPARAN DI POJOK KANAN ATAS ─── */
        .audio-float-btn {
            position: absolute;
            top: 25px;
            right: 20px;
            z-index: 50;
            background: rgba(20, 26, 50, 0.35);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--muted);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .audio-float-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--neon-blue);
            color: #fff;
            transform: scale(1.08);
        }

        .audio-float-btn.playing {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        @media (max-width: 600px) {
            .audio-float-btn {
                top: 15px;
                right: 12px;
                width: 30px;
                height: 30px;
                font-size: 0.72rem;
            }
        }

        /* ================= ANIMASI LATAR BELAKANG KAYA SAINS & SPACE ================= */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0b0f25 0%, #03050a 100%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 120px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 160px, var(--gold), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 250px 90px, var(--neon-purple), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.45;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .galaxy-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
            animation: floatBlob 15s infinite alternate ease-in-out;
        }

        .blob-1 { width: 450px; height: 450px; background: var(--neon-blue); top: -5%; left: -10%; }
        .blob-2 { width: 550px; height: 550px; background: var(--neon-purple); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: var(--gold); top: 40%; right: 20%; animation-delay: -8s; opacity: 0.1; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.15); }
        }

        .floating-icon {
            position: absolute;
            color: var(--neon-blue);
            opacity: 0.55;
            user-select: none;
            filter: drop-shadow(0 0 12px currentColor);
        }

        .el-rocket { top: 12%; right: 7%; font-size: 2.8rem; color: var(--neon-blue); animation: flyRocket 14s infinite ease-in-out; }
        .el-astronaut1 { bottom: 15%; left: 4%; font-size: 2.5rem; color: var(--gold); animation: floatItem1 11s infinite alternate ease-in-out; }
        .el-astronaut2 { top: 35%; left: 8%; font-size: 2rem; color: var(--neon-purple); animation: floatItem2 9s infinite alternate ease-in-out; opacity: 0.4; }
        
        .el-atom { top: 18%; left: 15%; font-size: 2.2rem; color: var(--gold); animation: rotateAtom 12s infinite linear; }
        .el-flask { bottom: 25%; right: 12%; font-size: 2.3rem; color: var(--neon-blue); animation: floatItem1 8s infinite alternate ease-in-out; }
        .el-magnet { top: 60%; left: 12%; font-size: 2.2rem; color: #ff4757; animation: floatItem2 10s infinite alternate ease-in-out; }
        .el-satellite { top: 8%; left: 40%; font-size: 2.2rem; color: var(--muted); animation: flySatellite 16s infinite linear; }

        .el-math1 { top: 25%; right: 25%; font-size: 2rem; font-family: 'Orbitron', sans-serif; color: var(--gold); animation: floatItem2 7s infinite alternate ease-in-out; font-weight: 800; }
        .el-math2 { top: 75%; left: 25%; font-size: 2.2rem; font-family: 'Orbitron', sans-serif; color: var(--neon-blue); animation: floatItem1 9s infinite alternate ease-in-out; font-weight: 800; }
        .el-math3 { top: 50%; right: 8%; font-size: 1.8rem; font-family: 'Orbitron', sans-serif; color: var(--neon-purple); animation: floatItem2 8s infinite alternate ease-in-out; font-weight: 800; }

        @keyframes flyRocket {
            0% { transform: translate(0, 0) rotate(45deg); }
            50% { transform: translate(-50px, 70px) rotate(40deg); }
            100% { transform: translate(0, 0) rotate(45deg); }
        }

        @keyframes floatItem1 {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-45px) rotate(15deg); }
        }

        @keyframes floatItem2 {
            0% { transform: translateY(0) rotate(10deg); }
            100% { transform: translateY(35px) rotate(-15deg); }
        }

        @keyframes rotateAtom {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes flySatellite {
            0% { transform: translateX(-50vw) translateY(0) rotate(0deg); }
            100% { transform: translateX(100vw) translateY(-30px) rotate(360deg); }
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 0 20px 80px;
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        header {
            padding: 30px 0 25px;
            text-align: center;
            position: relative;
        }

        .logo-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .logo-item {
            background: transparent;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: none;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-item:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
        }

        .logo-item img {
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        .logo-item img[src="yasarini.png"], .logo-item img[alt="Logo Yasarini"] { height: 65px !important; }
        .logo-item img[src="fesa.png"], .logo-item img[alt="Logo FESA"] { height: 100px !important; }
        .logo-item img[alt="Logo AMSO"], .logo-item img[src="amso.png"] { height: 100px !important; }

        nav {
            background: rgba(15, 21, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px;
            backdrop-filter: blur(12px);
            display: inline-flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.3), rgba(157, 78, 221, 0.3));
            border: 1px solid rgba(0, 210, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .dropdown {
            position: relative;
            display: inline-flex;
            padding-bottom: 15px; 
            margin-bottom: -15px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 21, 42, 0.95);
            border: 1px solid var(--border);
            border-radius: 15px;
            min-width: 190px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            z-index: 100;
            padding: 8px;
            text-align: left;
        }

        .dropdown-content a {
            color: var(--muted);
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            border-radius: 10px;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .dropdown-content a:hover {
            background: rgba(0, 210, 255, 0.15);
            color: var(--neon-blue);
            border: none;
            box-shadow: none;
            transform: none;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 60%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 210, 255, 0.3);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-download {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            border: 1px solid rgba(16, 185, 129, 0.5);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
        }

        .btn-fullscreen {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.25), rgba(0, 210, 255, 0.2));
            color: #fff;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.2);
        }

        .btn-fullscreen:hover {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
        }

        /* ================= MAIN CONTENT VIEWER (A4 PROPORTIONS) ================= */
        main {
            flex: 1;
            padding: 10px 0 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .viewer-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(14px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }

        .viewer-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--gold));
            z-index: 2;
        }

        .viewer-header {
            padding: 14px 20px;
            background: rgba(15, 21, 42, 0.95);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .viewer-header .file-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: 600;
        }

        .viewer-frame-container {
            width: 100%;
            height: 84vh;
            min-height: 680px;
            max-height: 1080px;
            background: #0b0f25;
            position: relative;
        }

        .viewer-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            .viewer-box {
                max-width: 100%;
                border-radius: 16px;
            }
            .viewer-frame-container {
                height: 75vh;
                min-height: 520px;
            }
        }

        /* ================= FOOTER ================= */
        footer {
            background: rgba(5, 7, 15, 0.95);
            border-top: 1px solid var(--border);
            padding: 35px 0 20px;
            margin-top: auto;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- ELEMEN AUDIO -->
<audio id="bgAudio" loop>
    <source src="Official%20Video%20Lirik%20Jingle%20FESA.mp4" type="video/mp4">
</audio>

<!-- LATAR BELAKANG ANIMASI SAINS & LUAR ANGKASA -->
<div class="space-bg">
    <div class="stars"></div>
    <div class="galaxy-blob blob-1"></div>
    <div class="galaxy-blob blob-2"></div>
    <div class="galaxy-blob blob-3"></div>

    <div class="floating-icon el-rocket"><i class="fa-solid fa-rocket"></i></div>
    <div class="floating-icon el-astronaut1"><i class="fa-solid fa-user-astronaut"></i></div>
    <div class="floating-icon el-astronaut2"><i class="fa-solid fa-space-shuttle"></i></div>
    <div class="floating-icon el-satellite"><i class="fa-solid fa-satellite"></i></div>

    <div class="floating-icon el-atom" title="Fisika Kuantum/Atom"><i class="fa-solid fa-atom"></i></div>
    <div class="floating-icon el-flask" title="Laboratorium Kimia/Sains"><i class="fa-solid fa-flask-vial"></i></div>
    <div class="floating-icon el-magnet" title="Medan Magnet"><i class="fa-solid fa-magnet"></i></div>

    <div class="floating-icon el-math1">&pi;</div>
    <div class="floating-icon el-math2">&sum;</div>
    <div class="floating-icon el-math3">&radic;</div>
</div>

<div class="container">
    <!-- HEADER GLOBAL OTOMATIS (SAMA PERSIS DENGAN HALAMAN UTAMA) -->
    <header id="header-placeholder"></header>

    <!-- JUDUL & TOMBOL AKSI BUKU PANDUAN -->
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 class="main-title">BUKU PANDUAN AMSO 2026</h1>
        <div class="sub-title">Petunjuk Teknis & Pelaksanaan Kegiatan</div>

        <!-- ACTION BUTTONS -->
        <div class="action-buttons">
            <!-- DOWNLOAD LANGSUNG -->
            <a href="https://drive.google.com/uc?export=download&id=1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3" class="btn-action btn-download">
                <i class="fa-solid fa-file-arrow-down"></i> Unduh Buku Panduan (PDF)
            </a>

            <!-- BUKA TAB BARU / FULLSCREEN -->
            <a href="https://drive.google.com/file/d/1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-action btn-fullscreen">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Layar Penuh
            </a>
        </div>
    </div>

    <!-- ================= MAIN CONTENT VIEWER ================= -->
    <main>
        <div class="viewer-box">
            <div class="viewer-header">
                <div class="file-title">
                    <i class="fa-solid fa-file-pdf" style="color: #ff4757; font-size: 1.1rem;"></i>
                    <span>Buku_Panduan_AMSO_2026.pdf</span>
                </div>
                <span><i class="fa-solid fa-eye" style="color: var(--neon-blue);"></i> Mode Pratinjau Dokumen</span>
            </div>

            <div class="viewer-frame-container">
                <iframe 
                    src="https://drive.google.com/file/d/1Yn5YBSoViDjtx9G1MzA9bPicCB2y9yF3/preview" 
                    allow="autoplay"
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </main>
</div>

<!-- FOOTER GLOBAL OTOMATIS -->
<footer id="footer-placeholder"></footer>

<!-- PANGGIL SCRIPT GLOBAL -->
<script src="global-audio.js"></script>

</body>
</html>
